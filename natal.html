<!DOCTYPE html>
  <html lang="pt">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de Natal · Isabelinha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    :root{
      --bg1:#fff4e6; --bg2:#ffe0b5;
      --texto:#663d00; --texto-forte:#552b00;
      --titulo:#cc5500; --strong:#b14300;
      --borda:#ffb347; --pill:#fff9f0; --pill-borda:#ff8c42;
      --rodape:#ffa726; --rodape-borda:#cc5500;
      --verde:#2f6b4f; --verde-esc:#245741; --verde-claro:#d8ece1;
      --dourado:#b5852a;
    }
    body{
      font-family:"Nunito", sans-serif;
      background:linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      color:var(--texto); min-height:100vh; display:flex; flex-direction:column; padding:20px 30px;
    }

    /* Voltar ao início */
    .voltar{
      align-self:flex-start; text-decoration:none; font-family:"Baloo 2", cursive; font-weight:700;
      color:var(--verde-esc); background:#ffffffbb; border:2px solid var(--verde);
      padding:8px 16px; border-radius:30px; font-size:.95rem; margin-bottom:8px;
      transition:transform .2s ease;
    }
    .voltar:hover{ transform:translateX(-3px); }

    .cabecalho{ text-align:center; margin:6px 0 22px; }
    .marca-texto{
      font-family:"Baloo 2", cursive; font-weight:800;
      font-size:clamp(2.4rem,6.5vw,4.4rem); color:var(--titulo); line-height:1;
      text-shadow:3px 4px 0 #ffd9a8, 6px 8px 14px rgba(255,140,0,.25);
    }
    .marca-img{ max-width:min(520px,80vw); filter:drop-shadow(0 8px 12px rgba(255,140,0,.35)); }

    /* Faixa festiva com a chamada para reservar */
    .faixa-natal{
      background:linear-gradient(145deg,var(--verde),var(--verde-esc));
      color:#fff; border:3px solid #1e4835; border-radius:28px;
      max-width:900px; width:100%; margin:0 auto 34px; padding:clamp(1.2rem,3vw,1.8rem);
      text-align:center; box-shadow:0 18px 38px rgba(36,87,65,.3);
    }
    .faixa-natal h1{
      font-family:"Baloo 2", cursive; font-weight:800; font-size:clamp(1.8rem,4.6vw,2.8rem);
      margin-bottom:.4rem;
    }
    .faixa-natal .prazo{ font-weight:700; font-size:clamp(1rem,2.3vw,1.25rem); color:var(--verde-claro); }
    .faixa-natal .como{ margin-top:.6rem; font-weight:700; font-size:clamp(.95rem,2.1vw,1.15rem); }
    .faixa-natal .como b{ color:#ffe6a8; }

    .palco{ flex:1 0 auto; display:flex; flex-direction:column; align-items:center; width:100%; }
    .cartoes{
      display:flex; flex-wrap:wrap; justify-content:center; align-items:stretch;
      gap:34px; max-width:1300px; width:100%; margin:0 auto 34px;
    }
    .cartao{
      background-color:#ffffffcc; backdrop-filter:blur(10px);
      border:3px solid var(--borda); border-radius:32px; padding:clamp(1.5rem,3.2vw,2.3rem);
      box-shadow:0 18px 36px rgba(255,140,0,.2); flex:1 1 420px; min-width:320px;
      display:flex; flex-direction:column; align-items:center; text-align:center;
    }
    .cartao h2{
      font-family:"Baloo 2", cursive; color:var(--verde-esc); font-size:clamp(1.5rem,3.6vw,2.2rem);
      border-bottom:4px solid var(--verde); padding-bottom:14px; margin-bottom:20px; width:100%;
      display:flex; align-items:center; justify-content:center; gap:.5rem;
    }
    .pill{
      font-size:clamp(1.05rem,2.4vw,1.45rem); margin:10px 0; padding:14px 22px;
      background-color:var(--pill); border-radius:36px; border-left:8px solid var(--verde);
      color:var(--texto-forte); box-shadow:0 4px 10px rgba(255,140,0,.1);
      width:100%; text-align:center; font-weight:700;
    }
    .pill strong{ color:var(--strong); font-weight:800; }
    .pill .preco{ color:var(--verde-esc); font-weight:800; white-space:nowrap; }
    .pill .desc{ display:block; font-size:.72em; font-weight:600; color:#8a5a20; margin-top:.2rem; }
    .vazio{ font-size:1.3rem; color:#8a5a20; font-weight:700; padding:1.5rem; }

    footer{
      flex-shrink:0; margin-top:20px; padding:24px 30px; width:100%;
      background:var(--rodape); color:#fff; font-weight:800; border-top:6px solid var(--rodape-borda);
    }
    .rodape-linha{ display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; font-size:clamp(1rem,2vw,1.25rem); }
    .rodape-linha .sep{ opacity:.7; }
    .social{ display:inline-flex; align-items:center; gap:8px; color:#fff; text-decoration:none; }
    .social:hover{ text-decoration:underline; }
    .social svg{ width:24px; height:24px; fill:#fff; }
    .estado{ margin-top:12px; text-align:center; font-size:.8rem; font-weight:700; opacity:.85; display:flex; align-items:center; justify-content:center; gap:.5rem; }
    .ponto{ width:9px; height:9px; border-radius:50%; background:#fff; display:inline-block; }
    .ponto.demo{ background:#ffe9c7; }
    .ponto.erro{ background:#7a1e14; }

    @media (max-width:768px){
      body{ padding:15px; }
      .cartoes{ gap:20px; }
      .rodape-linha{ flex-direction:column; gap:10px; }
      .rodape-linha .sep{ display:none; }
    }
    </style>
    </head>
    <body>

      <a class="voltar" href="index.html">← Início</a>

      <header class="cabecalho">
        <div id="marca"></div>
      </header>

      <div class="faixa-natal">
        <h1 id="faixaTitulo">🎄 Reservas de Natal</h1>
        <div class="prazo" id="faixaPrazo"></div>
        <div class="como" id="faixaComo"></div>
      </div>

      <div class="palco">
        <div class="cartoes" id="cartoes"></div>
      </div>

      <footer>
        <div class="rodape-linha" id="rodapeLinha"></div>
        <div class="estado" id="estado"><span class="ponto"></span><span id="estadoTexto">a carregar…</span></div>
      </footer>

      <script>
        /* ══════════════════════════════════════════════════════════════════
          ⚙️  CONFIGURAÇÃO
          ══════════════════════════════════════════════════════════════════ */
        const CONFIG = {
          CAFE_NOME: "Isabelinha",
          LOGO_URL: "images/logo.png",

          // Faixa festiva
          NATAL: {
            titulo: "🎄 Reservas de Natal",
            prazo:  "Encomendas até 22 de dezembro",
            como:   "Reserve pelo telefone <b>214 941 693</b> ou aqui na loja"
          },

          // Rodapé
          TELEFONE:  "214 941 693",
          HORARIO:   "06h30–19h · Folga à quarta",
          FACEBOOK:  { nome:"Isabelina LDA",           url:"#" },
          INSTAGRAM: { nome:"@pastelaria.isabelinha",  url:"#" },

          // 👉 Link CSV da FOLHA DE NATAL (o mesmo Sheets, outra folha → outro gid).
          //    Publica a folha "Natal" em CSV e cola aqui o link (acaba em output=csv).
          CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQAQFwogMZ-l62Di5o9NO60DYQ0R24PUD7x9FUcKpdY73cPY3GIrL0JiWBw7x3H7bKQua9iHBPokiWg/pub?gid=435908198&single=true&output=csv",

          INTERVALO_SEGUNDOS: 300,   // o Natal muda pouco; de 5 em 5 minutos chega

          // Ordem preferida das categorias (as que não estiverem aqui aparecem a seguir)
          ORDEM: ["Doçaria de Natal", "Refeições de Consoada", "Bebidas"],
          EMOJI: { "docaria de natal":"🍰", "refeicoes de consoada":"🍽️", "bebidas":"🍷" }
        };

        /* ── Catálogo de exemplo (enquanto CSV_URL estiver vazio) ────────── */
        const DEMO = [
          { categoria:"Doçaria de Natal",     produto:"Bolo-Rei",        descricao:"receita da casa, frutas e frutos secos", preco:"14,00 €", unidade:"à unidade" },
          { categoria:"Doçaria de Natal",     produto:"Bolo-Rainha",     descricao:"só frutos secos, sem frutas cristalizadas", preco:"15,00 €", unidade:"à unidade" },
          { categoria:"Doçaria de Natal",     produto:"Rabanadas",       descricao:"", preco:"12,00 €", unidade:"dúzia" },
          { categoria:"Doçaria de Natal",     produto:"Filhoses",        descricao:"", preco:"8,00 €",  unidade:"dúzia" },
          { categoria:"Doçaria de Natal",     produto:"Sonhos",          descricao:"", preco:"9,00 €",  unidade:"dúzia" },
          { categoria:"Doçaria de Natal",     produto:"Broas Castelares","descricao":"", preco:"10,00 €", unidade:"kg" },
          { categoria:"Refeições de Consoada",produto:"Bacalhau com Todos", descricao:"por encomenda, mínimo 2 pessoas", preco:"15,00 €", unidade:"por pessoa" },
          { categoria:"Refeições de Consoada",produto:"Peru Recheado",   descricao:"encomenda com 48h de antecedência", preco:"45,00 €", unidade:"à unidade" }
        ];

        /* ══════════════════════════════════════════════════════════════════
          A partir daqui não é preciso mexer.
          ══════════════════════════════════════════════════════════════════ */

        // Marca
        (function(){
          const alvo=document.getElementById("marca");
          if(CONFIG.LOGO_URL){ const i=document.createElement("img"); i.className="marca-img"; i.src=CONFIG.LOGO_URL; i.alt=CONFIG.CAFE_NOME; alvo.appendChild(i); }
          else { const t=document.createElement("div"); t.className="marca-texto"; t.textContent=CONFIG.CAFE_NOME; alvo.appendChild(t); }
          document.title = "Reservas de Natal · " + CONFIG.CAFE_NOME;
        })();

        // Faixa festiva
        document.getElementById("faixaTitulo").textContent = CONFIG.NATAL.titulo;
        document.getElementById("faixaPrazo").textContent = CONFIG.NATAL.prazo;
        document.getElementById("faixaComo").innerHTML = CONFIG.NATAL.como;

        // Rodapé
        (function(){
          const svgFB='<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>';
          const svgIG='<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.3-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1.1.1-1.7.2-2.1.4-.5.2-.9.4-1.3.8-.4.4-.6.8-.8 1.3-.2.4-.3 1-.4 2.1C2.6 9.5 2.6 9.9 2.6 12s0 3.5.1 4.7c.1 1.1.2 1.7.4 2.1.2.5.4.9.8 1.3.4.4.8.6 1.3.8.4.2 1 .3 2.1.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.7-.2 2.1-.4.5-.2.9-.4 1.3-.8.4-.4.6-.8.8-1.3.2-.4.3-1 .4-2.1.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.7-.4-2.1-.2-.5-.4-.9-.8-1.3-.4-.4-.8-.6-1.3-.8-.4-.2-1-.3-2.1-.4-1.2-.1-1.6-.1-4.7-.1zm0 3.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8zm0 8.1a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm6.2-8.3a1.15 1.15 0 1 1-2.3 0 1.15 1.15 0 0 1 2.3 0z"/></svg>';
          document.getElementById("rodapeLinha").innerHTML =
            `<span>📞 ${CONFIG.TELEFONE}</span><span class="sep">|</span>`+
            `<span>🕐 ${CONFIG.HORARIO}</span><span class="sep">|</span>`+
            `<a class="social" href="${CONFIG.FACEBOOK.url}">${svgFB}${CONFIG.FACEBOOK.nome}</a><span class="sep">|</span>`+
            `<a class="social" href="${CONFIG.INSTAGRAM.url}">${svgIG}${CONFIG.INSTAGRAM.nome}</a>`;
        })();

        /* ── CSV ─────────────────────────────────────────────────────────── */
        function lerCSV(texto){
          const linhas=[]; let campo="", linha=[], aspas=false;
          for(let i=0;i<texto.length;i++){
            const c=texto[i];
            if(aspas){ if(c==='"'&&texto[i+1]==='"'){campo+='"';i++;} else if(c==='"'){aspas=false;} else{campo+=c;} }
            else{ if(c==='"'){aspas=true;} else if(c===','){linha.push(campo);campo="";}
              else if(c==='\n'){linha.push(campo);linhas.push(linha);linha=[];campo="";}
              else if(c==='\r'){} else{campo+=c;} }
          }
          if(campo!==""||linha.length){linha.push(campo);linhas.push(linha);}
          return linhas.filter(l=>l.some(v=>v.trim()!==""));
        }
        function normalizar(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase(); }

        function csvParaItens(texto){
          const linhas=lerCSV(texto);
          if(!linhas.length) return [];
          const cab=linhas[0].map(normalizar);
          const col=n=>cab.indexOf(n);
          const idx={
            categoria:[col("categoria")].find(i=>i>-1) ?? -1,
            produto:[col("produto"),col("prato"),col("nome"),col("item")].find(i=>i>-1) ?? -1,
            descricao:[col("descricao")].find(i=>i>-1) ?? -1,
            preco:[col("preco")].find(i=>i>-1) ?? -1,
            unidade:[col("unidade")].find(i=>i>-1) ?? -1
          };
          if(idx.produto===-1){ idx.produto=0; if(idx.preco===-1) idx.preco=1; }
          const val=(l,i)=> i>-1 ? (l[i]||"").trim() : "";
          return linhas.slice(1).map(l=>({
            categoria:val(l,idx.categoria), produto:val(l,idx.produto),
            descricao:val(l,idx.descricao), preco:val(l,idx.preco), unidade:val(l,idx.unidade)
          })).filter(it=>it.produto!=="");
        }

        function criarPill(it){
          const p=document.createElement("p"); p.className="pill";
          const preco = it.preco ? `${it.preco}${it.unidade?` <span style="font-weight:700">/ ${it.unidade}</span>`:""}` : "";
          p.innerHTML = `<strong>${it.produto}</strong>${preco?` — <span class="preco">${preco}</span>`:""}`;
          if(it.descricao) p.innerHTML += `<span class="desc">${it.descricao}</span>`;
          return p;
        }

        /* ── Desenha ─────────────────────────────────────────────────────── */
        let assinatura="";
        function desenhar(itens){
          const nova=JSON.stringify(itens);
          if(nova===assinatura) return;
          assinatura=nova;

          const cartoes=document.getElementById("cartoes");
          cartoes.innerHTML="";

          if(!itens.length){
            cartoes.innerHTML='<div class="cartao"><div class="vazio">As encomendas de Natal ainda não foram publicadas.</div></div>';
            return;
          }

          const grupos={}; const ordem=[];
          itens.forEach(it=>{
            const chave=it.categoria||"Encomendas";
            if(!grupos[chave]){ grupos[chave]=[]; ordem.push(chave); }
            grupos[chave].push(it);
          });
          const ordenadas=[...CONFIG.ORDEM.filter(s=>grupos[s]), ...ordem.filter(s=>!CONFIG.ORDEM.includes(s))];

          ordenadas.forEach(nome=>{
            const cartao=document.createElement("div"); cartao.className="cartao";
            const emoji=CONFIG.EMOJI[normalizar(nome)]||"🎁";
            const h2=document.createElement("h2"); h2.textContent=`${nome} ${emoji}`; cartao.appendChild(h2);
            grupos[nome].forEach(it=> cartao.appendChild(criarPill(it)));
            cartoes.appendChild(cartao);
          });
        }

        function definirEstado(tipo,texto){
          document.querySelector("#estado .ponto").className="ponto"+(tipo==="demo"?" demo":tipo==="erro"?" erro":"");
          document.getElementById("estadoTexto").textContent=texto;
        }

        async function buscar(){
          if(!CONFIG.CSV_URL){
            desenhar(DEMO);
            definirEstado("demo","Catálogo de exemplo — falta ligar a folha «Natal»");
            return;
          }
          try{
            const url=CONFIG.CSV_URL+(CONFIG.CSV_URL.includes("?")?"&":"?")+"t="+Date.now();
            const r=await fetch(url);
            if(!r.ok) throw new Error("HTTP "+r.status);
            desenhar(csvParaItens(await r.text()));
            const h=new Date();
            definirEstado("ok",`Atualizado às ${String(h.getHours()).padStart(2,"0")}:${String(h.getMinutes()).padStart(2,"0")}`);
          }catch(e){
            console.error("Falha ao ler o Natal:",e);
            if(assinatura==="") desenhar(DEMO);
            definirEstado("erro","Sem ligação — a mostrar o último catálogo");
          }
        }
        buscar(); setInterval(buscar, CONFIG.INTERVALO_SEGUNDOS*1000);
      </script>
    </body>
  </html>
